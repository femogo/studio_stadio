<text x="18" y="185" fill="#8b949e"># 2 · Entorno virtual y dependencias</text>
<text x="18" y="204" fill="#7ee787" font-weight="600">$ python3 -m venv .venv-studio</text>
<text x="18" y="223" fill="#7ee787" font-weight="600">$ .venv-studio/bin/pip install -r requirements.txt</text>
<text x="18" y="242" fill="#e6edf3">Successfully installed aiosqlite-0.22.1 annotated_doc-0.0.6 [...] langgraph-1.2.22 [...]</text>
