<text x="18" y="280" fill="#7ee787" font-weight="600">$ .venv-studio/bin/playwright install chromium-headless-shell</text>
<text x="18" y="299" fill="#e6edf3">[...]</text>
<text x="18" y="318" fill="#e6edf3">FFmpeg (playwright ffmpeg v1013) downloaded to [...]</text>
<text x="18" y="337" fill="#7ee787" font-weight="600">$ cp settings.example.json settings.json</text>
