<text x="18" y="52" fill="#7ee787" font-weight="600">$ git clone https://github.com/femogo/studio_stadio.git</text>
<text x="18" y="71" fill="#7ee787" font-weight="600">$ cd studio_stadio/demo/studio</text>
<text x="18" y="90" fill="#8b949e"># 1 · Modelos de Ollama</text>
<text x="18" y="109" fill="#7ee787" font-weight="600">$ ollama pull qwen2.5:7b</text>
<text x="18" y="128" fill="#e6edf3">success</text>
<text x="18" y="147" fill="#7ee787" font-weight="600">$ ollama pull nomic-embed-text</text>
