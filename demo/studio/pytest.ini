[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    spike: verificación de APIs de LangGraph (paso 1a)
    gpu: usa GPU/modelos reales (lento; excluido por defecto)
    ui: pruebas de interfaz con Playwright
    llm: necesita Ollama con qwen2.5:7b y nomic-embed-text (excluido por defecto)
addopts = -m "not gpu and not llm"
